# Keep cache policy at server level, so location-specific add_header directives
# cannot accidentally discard the security headers on assets or JSON files.
map $uri $resume_cache_control {
  default "no-cache";
  ~^/_nuxt/ "public, max-age=31536000, immutable";
  ~^/cv-(data-[a-z0-9-]+|config)\.json$ "no-store, no-cache, must-revalidate, max-age=0";
  ~^/CV_Ghassen_Bargougui(?:-[a-z0-9-]+)?\.pdf$ "no-store, no-cache, must-revalidate, max-age=0";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header Cache-Control $resume_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  # Static Nuxt payloads/theme initialization and Vue style bindings require
  # inline scripts/styles. Limit external scripts and connections to Umami;
  # hashes/nonces would need regeneration for every generated HTML response.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://umami.ghassen.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://umami.ghassen.io; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  error_page 404 /not-found.html;
  location = /not-found.html {
    internal;
  }

  # Runtime-mountable CV data + shared config: always served fresh so a
  # ConfigMap/volume update is picked up immediately.
  location ~ ^/cv-(data-[a-z0-9-]+|config)\.json$ {
    try_files $uri =404;
  }

  location ~ ^/CV_Ghassen_Bargougui(?:-[a-z0-9-]+)?\.pdf$ {
    try_files $uri =404;
  }

  location /_nuxt/ {
    try_files $uri =404;
  }

  location / {
    # Resolve language pages directly, without a directory redirect whose port
    # or scheme could be wrong behind Docker or an HTTPS reverse proxy.
    try_files $uri $uri/index.html =404;
  }
}
